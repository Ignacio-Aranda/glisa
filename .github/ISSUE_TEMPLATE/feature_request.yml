name: Feature request
description: An idea for Glisa.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or situation first; the solution you have in mind after.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered
