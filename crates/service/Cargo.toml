[package]
name = "glisa-service"
description = "Glisa device service: device manager, settings, actions, JSON API, IPC, setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
glisa-common.workspace = true
glisa-hid.workspace = true
glisa-hidpp.workspace = true
glisa-i18n.workspace = true
glisa-input.workspace = true
log.workspace = true
serde_json.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO"] }
